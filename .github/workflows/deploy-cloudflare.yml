name: Deploy Tax Battle to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tax-battle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare D1 binding
        run: node scripts/prepare-cloudflare-config.mjs

      - name: Build application
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tax-battle-db --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.jsonc
